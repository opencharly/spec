# The spec module's project manifest. Its maintenance surface is the
# `charly task` verbs below — the same generic plugin-task surface the umbrella
# and charly use. spec owns NO candies/boxes, so there is no `discover:`; only
# the task entities are declared.
#
# Run a task with the `charly` binary (spec is a submodule of
# opencharly/opencharly and opencharly/charly):
#   charly task cue-gen
# The binary is installed as a native package or built once per clone by a
# checkout's `scripts/bootstrap-charly.sh` — spec ships no Go binary of its own.
#
# Two authoring notes every task here obeys:
#   * `run:` shell snippets must use LOWERCASE shell locals: an uppercase ${NAME}
#     is reserved for the plan grammar's check-variable expansion, and an
#     unresolved one makes the step SKIP ("unresolved variables"), not run.
#   * every Go invocation sets GOWORK=off — spec is a standalone module (it is
#     never a workspace member), so a stray ancestor go.work must not shadow it.
repo: github.com/opencharly/spec

# -----------------------------------------------------------------------------
# bootstrap-cue — ensure ./bin/cue is the pinned cue CLI (checksum-verified).
# Idempotent: a present, correct bin/cue short-circuits without a download.
# -----------------------------------------------------------------------------
bootstrap-cue:
  task:
    description: Ensure ./bin/cue is the pinned cue CLI (checksum-verified download)
    dir: .
    plan:
      - run: download and checksum-verify the pinned cue CLI
        command: |
          set -euo pipefail
          # The version, URL, checksum and arch rules live in ONE place —
          # internal/cuesetup -> cuetoolchain — shared with the charly-side generation
          # verb, so this task and that verb can never run different toolchains.
          GOWORK=off go run ./internal/cuesetup bin
        context: [deploy]

# -----------------------------------------------------------------------------
# bootstrap-protoc — ensure ./bin has the pinned protoc + codegen plugins.
# -----------------------------------------------------------------------------
bootstrap-protoc:
  task:
    description: Ensure ./bin has the pinned protoc + protoc-gen-go + protoc-gen-go-grpc
    dir: .
    plan:
      - run: download and pin protoc + the two Go codegen plugins
        command: |
          set -euo pipefail
          mkdir -p bin
          zip="protoc-28.3-linux-x86_64.zip"
          url="https://github.com/protocolbuffers/protobuf/releases/download/v28.3/$zip"
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          if ! test -x bin/protoc || ! bin/protoc --version 2>/dev/null | grep -q '28.3'; then
            curl -fsSL "$url" -o "$tmp/$zip"
            echo "0ad949f04a6a174da83cdcbdb36dee0a4925272a5b6d83f79a6bf9852076d53f  $tmp/$zip" | sha256sum -c - \
              || { echo "proto:bootstrap: protoc checksum mismatch — refusing tampered/wrong artifact" >&2; exit 1; }
            python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$tmp/$zip" "$tmp/x"
            cp "$tmp/x/bin/protoc" bin/protoc && chmod +x bin/protoc
          fi
          # protoc-gen-go-grpc v1.3.0 is REQUIRED: it emits the
          # SupportPackageIsVersion7 API the pinned grpc library expects. A stale
          # wrong-version binary must be re-installed, not trusted by existence.
          test -x bin/protoc-gen-go || GOWORK=off GOBIN="$PWD/bin" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          if ! test -x bin/protoc-gen-go-grpc || ! bin/protoc-gen-go-grpc --version 2>/dev/null | grep -q '1.3.0'; then
            GOWORK=off GOBIN="$PWD/bin" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
          fi
          echo "bootstrap-protoc: pinned protoc + codegen plugins present"
        context: [deploy]

# -----------------------------------------------------------------------------
# wire-gen — regenerate the protobuf IDL and Go stubs from protocol/schema.
#
#   proto/plugin.pb.go       (messages)
#   proto/plugin_grpc.pb.go  (services)
#
# proto/plugin.proto is generated output, never an authoring surface.
# Reproducible: rm -f bin/protoc*; charly task proto-gen && git diff --exit-code proto
# -----------------------------------------------------------------------------
wire-gen:
  task:
    description: Regenerate proto/plugin.proto and Go stubs from protocol/schema/*.cue
    dir: .
    depends_on: [bootstrap-protoc]
    plan:
      - run: render the proto IDL from CUE and compile the Go stubs
        command: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          GOWORK=off go run ./internal/wiregen -schema=protocol/schema -out=proto/plugin.proto
          bin/protoc \
            --go_out=. --go_opt=module=github.com/opencharly/spec \
            --go-grpc_out=. --go-grpc_opt=module=github.com/opencharly/spec \
            --proto_path=proto proto/plugin.proto
          gofmt -w proto/plugin.pb.go proto/plugin_grpc.pb.go
          echo "wire-gen: regenerated proto/plugin.proto and Go stubs from CUE"
        context: [deploy]

# proto-gen — compatibility alias for wire-gen. The protobuf source is CUE.
proto-gen:
  task:
    description: Alias for wire-gen
    dir: .
    depends_on: [wire-gen]
    plan:
      - run: "no-op alias (wire-gen is the real step)"
        command: "echo 'proto-gen: wire-gen is the canonical task'"
        context: [runtime]

# -----------------------------------------------------------------------------
# cue-gen — regenerate every CUE-owned artifact.
#
#   spec/cue_types_gen.go  (cue exp gengotypes — the Go param structs)
#   spec/vocab_gen.go      (internal/schemagen — the vocab lists)
#
# Reproducible: two consecutive runs produce no diff (TestGenReproducible).
# -----------------------------------------------------------------------------
cue-gen:
  task:
    description: Regenerate all CUE-owned artifacts, including the protobuf wire contract
    dir: .
    depends_on: [bootstrap-cue, wire-gen]
    plan:
      - run: gengotypes + schemagen the generated Go
        command: |
          set -euo pipefail
          # 1) The params file comes from the ONE pipeline (schemaparams): concatenate
          #    schema/*.cue under `package spec` + `@go(spec)`, run the pinned cue
          #    gengotypes (provisioned checksum-verified into ./bin), normalize the
          #    struct tags. No step of it is re-implemented here or in schemagen, and
          #    the charly-side verb calls the same function.
          GOWORK=off go run ./internal/schemagen -mode=params -schema=schema -pkg=spec -out=spec/cue_types_gen.go
          # 2) Companion generator -> the vocab lists.
          GOWORK=off go run ./internal/schemagen -mode=vocab -schema=schema -out=spec/vocab_gen.go
          # 4) gofmt the committed generated files.
          gofmt -w spec/cue_types_gen.go spec/vocab_gen.go
          echo "cue-gen: regenerated spec/{cue_types_gen.go,vocab_gen.go}"
        context: [deploy]
      - check: regen is reproducible — TestGenReproducible passes on the committed tree
        command: GOWORK=off go test ./spec/ -run TestGenReproducible -count=1
        stdout:
          - contains: ok
        context: [runtime]

# -----------------------------------------------------------------------------
# The R10 bed for this repo's change class.
#
# spec's change class is a SCHEMA/generated-artifact change: it owns no candies
# and no boxes, and declares no `discover:`, so the ordinary deploy -> check-live
# bed shape has nothing to deploy here. What it CAN do is exactly what this
# manifest already declares: run the deterministic checks that own each
# generated artifact, on a `disposable: true` host:local venue, through the
# ACTIVE binary.
#
# The bed wraps checks that ALREADY EXIST as `task:` plan steps above - it adds
# no second mechanism (R2). `cue-gen` owns the CUE-generated Go
# (TestGenReproducible); the wire contract is owned by wire-gen.
#
# NOTE, from this file's own authoring rules: shell locals in these steps are
# LOWERCASE, because an uppercase plan-grammar variable that cannot be resolved
# makes the step SKIP rather than fail. That rule cost a sibling repo two rounds;
# it is obeyed here from the start.
spec-schema-venue:
    local:
        description: |-
            A no-op kind:local venue: this repo ships no candy and no box, so the
            venue carries nothing but the checkout under test and the active binary.
            `candy: []` is the explicit placeholder the schema requires - an empty list
            says "deliberately nothing", which is exactly this repo's situation.
        candy: []
check-spec-schema:
    local:
        from: spec-schema-venue
        host: local
        disposable: true
        lifecycle: dev
        description: >-
            R10 gate for spec's change class on a disposable host:local venue: the CUE-generated Go
            must be reproducible from the committed schema (TestGenReproducible). That is the ONE
            check this bed wraps.
            The generated protobuf wire contract's reproducibility is declared elsewhere in this
            manifest as a recipe, not as a plan step: `wire-gen` (and its `proto-gen` alias), whose
            own comment records the check - `rm -f bin/protoc*; charly task proto-gen && git diff
            --exit-code proto`. This bed does NOT run it, and an earlier version of this description
            said it did; a description that diverges from what the bed runs is an R1 incident, so it
            is corrected here rather than left claiming a step that is not in the plan. Wrapping the
            wire-contract check as a second step of this bed is a follow-up, not a claim.
        plan:
            - check: the CUE-generated Go is reproducible from the committed schema
              id: spec-cue-gen-reproducible
              context:
                - runtime
              timeout: 900s
              command:
                  command: |
                      set -euo pipefail
                      # No plan-grammar variable is used here: this repo's own manifest records
                      # that an unresolvable uppercase token makes the step SKIP rather than run,
                      # and a sibling repo lost two rounds to exactly that. The module is located
                      # by walking up from wherever the venue put us - no variable, no hardcoded
                      # path, and a loud failure if it is not found.
                      n=0
                      while [ ! -f spec/cue_types_gen.go ]; do
                        cd ..
                        n=$((n + 1))
                        if [ "$n" -gt 8 ] || [ "$PWD" = / ]; then
                          echo "cannot locate the spec module from this venue's cwd" >&2
                          exit 1
                        fi
                      done
                      echo "gating in $(pwd)"
                      GOWORK=off go test ./spec/ -run TestGenReproducible -count=1
                  in_container: false

# -----------------------------------------------------------------------------
# The DEPLOY-CLASS bed this change class actually requires.
#
# spec#242's verdict blocks on A2/R10 with a precise demand: "a deploy-class bed
# that provisions a venue and confirms the delivered tree arrives and is served".
# `check-spec-schema` above is NOT that bed - it provisions a venue and asserts
# nothing arrives there. It is a check, and calling it the gate would be the
# bare-`go test` substitute the same verdict names as fraud.
#
# This repo owns no candy and no box, but a kind:local template's `candy:` field
# accepts an @github ref, so the venue can carry a candy this repo does not own.
# The plugin below is what makes the venue a place where a delivered plugin tree
# can be SERVED, which is the thing the delivery path is for.
spec-delivery-venue:
    local:
        description: |-
            A kind:local venue that carries a real plugin, so the delivery path has something to
            serve. Referenced by @github ref precisely because spec owns no candy of its own.
        candy:
            - '@github.com/opencharly/plugin-firecracker/candy/plugin-firecracker'
check-spec-delivery:
    local:
        from: spec-delivery-venue
        host: local
        disposable: true
        lifecycle: dev
        description: >-
            R10 gate for exec/'s plugin-tree delivery, on the venue above: a BUILT plugin tree is
            delivered INTO this venue through the changed path, and the venue's own charly must then
            SERVE a word that tree supplies. The venue's candy composition only DECLARES that word -
            it serves nothing by itself - so the delivery is the only thing that can put a served
            plugin word here, and the first step proves it by failing when there is none.
        plan:
            - check: with no delivered tree this venue serves no plugin word at all
              id: spec-delivery-nothing-served-before-the-delivery
              context:
                - runtime
              timeout: 900s
              command:
                  command: |
                      set -euo pipefail
                      # A host:local plan step does NOT run with the repo root as cwd, so every step
                      # below walks up to the project - the same walk the sibling bed uses - and fails
                      # loudly rather than gating whatever project the venue's cwd happens to hold.
                      n=0
                      while [ ! -f exec/charly_plugins.go ]; do
                        cd ..
                        n=$((n + 1))
                        if [ "$n" -gt 8 ] || [ "$PWD" = / ]; then
                          echo "cannot locate the spec module from this venue's cwd" >&2
                          exit 1
                        fi
                      done
                      echo "gating in $(pwd)"

                      # Every step leaves its DECIDING line in one file under the gitignored `.check`
                      # tree, which this first step clears. The runner does NOT retain a `command:`
                      # step's stdout, so without this a green row carries no readable reason - and a
                      # green row whose reason nobody can read is the vacuous gate this bed replaces.
                      # `tee` makes recording part of the step: one that cannot say what it measured
                      # FAILS instead of passing silently.
                      ev=.check/spec-delivery-evidence.log
                      rm -f "$ev"

                      # Start from an UNDELIVERED venue, so the arm below is a real before-state and
                      # every run measures ITS OWN delivery rather than a leftover of an earlier one.
                      # Both names are the delivery's own contract - the stable path a plan emits, and
                      # the content-addressed replicas it republishes from - not paths this bed invented.
                      # DISP: this bed must not destroy a tree it does NOT own. The stable path is the
                      # PLAN's published plugin path, shared with every other deploy on this host, and an
                      # earlier version of this step removed it unconditionally - a destroy of a
                      # non-disposable shared resource with no guard.
                      #
                      # Ownership is proved by a marker THIS bed writes below. An ABSENT path is free; a
                      # path whose marker names this bed is ours to replace; ANYTHING ELSE belongs to
                      # somebody else, and we REFUSE rather than destroy it. Renaming the namespace is not
                      # an option: it is the path the plan emits, and pointing this bed elsewhere made the
                      # delivery step fail with "the delivery did not publish the stable plugin path the
                      # plan emits" - the bed would stop testing the contract it exists to test.
                      owns=/tmp/charly-plugins-spec-delivery-owner
                      set -- /tmp/charly-plugins-*
                      if [ -e /tmp/charly-plugins ] || [ -e "$1" ]; then
                        if [ ! -f "$owns" ] || [ "$(cat "$owns" 2>/dev/null)" != "check-spec-delivery" ]; then
                          echo "this venue already carries a published plugin tree that this bed did not publish:" >&2
                          ls -ld /tmp/charly-plugins /tmp/charly-plugins-* 2>/dev/null >&2 || true
                          echo "refusing to destroy it (DISP). Run this bed on a host whose plugin path it owns," >&2
                          echo "or remove that tree yourself if you are certain nothing depends on it." >&2
                          exit 1
                        fi
                      fi
                      rm -rf /tmp/charly-plugins
                      rm -rf /tmp/charly-plugins-*
                      printf '%s\n' "check-spec-delivery" > "$owns"

                      # THE FALSIFIER. The word the next steps assert is DECLARED by the venue's own
                      # candy composition but is not a charly command until a `.providers` manifest
                      # names it, so with nothing delivered the invocation must fail with charly's own
                      # unknown-command message. Requiring that MESSAGE rather than a bare non-zero
                      # exit is what stops a broken venue from reading as a missing delivery - and a
                      # falsifier that cannot tell those apart proves nothing.
                      if out="$(CHARLY_PLUGIN_DIR=/tmp/charly-plugins "${CHARLY_BIN}" firecracker doctor 2>&1)"; then
                        echo "this venue serves firecracker with NO delivered tree, so the word does not come from the delivery" >&2
                        exit 1
                      fi
                      case "$out" in
                        *"unexpected argument firecracker"*) ;;
                        *)
                          printf '%s\n' "$out" >&2
                          echo "firecracker failed for a reason other than 'not a command at all', so this falsifier cannot tell a missing delivery from a broken venue" >&2
                          exit 1
                          ;;
                      esac
                      printf '%s\n' "undelivered venue: firecracker is not a charly command here" | tee -a "$ev"
                  in_container: false
            - check: build the plugin tree this venue declares, and deliver it INTO the venue
              id: spec-delivery-delivers-the-built-tree
              context:
                - runtime
              timeout: 900s
              command:
                  command: |
                      set -euo pipefail
                      n=0
                      while [ ! -f exec/charly_plugins.go ]; do
                        cd ..
                        n=$((n + 1))
                        if [ "$n" -gt 8 ] || [ "$PWD" = / ]; then
                          echo "cannot locate the spec module from this venue's cwd" >&2
                          exit 1
                        fi
                      done
                      echo "gating in $(pwd)"

                      # THE BUILT PLUGIN TREE. A deploy gets this tree from its build's `.plugins`
                      # staging directory; spec owns no box to bake one, so this bed builds the tree
                      # for the plugin candy THIS VENUE'S OWN composition declares, from the source
                      # charly's resolver already fetched, with the Go invocation charly's own plugin
                      # build uses: the ./cmd/serve shim inside the candy's own module, GOWORK=off (a
                      # plugin module is never a workspace member) and -buildvcs=false. The manifest
                      # written beside the binary is the one that candy's `plugin:` block declares,
                      # verb:firecracker beside command:firecracker.
                      candysrc=""
                      for d in "$HOME"/.cache/charly/repos/github.com/opencharly/plugin-firecracker@main \
                               "$HOME"/.cache/charly/repos/github.com/opencharly/plugin-firecracker@*; do
                        if [ -f "$d/candy/plugin-firecracker/go.mod" ]; then
                          candysrc="$d/candy/plugin-firecracker"
                          break
                        fi
                      done
                      if [ -z "$candysrc" ]; then
                        echo "cannot locate the plugin-firecracker candy source this venue's composition resolves, so there is no built plugin tree to deliver" >&2
                        exit 1
                      fi
                      tree=/tmp/spec-delivery-tree
                      rm -rf "$tree"
                      mkdir -p "$tree"
                      echo "building the venue's plugin tree from $candysrc"
                      ( cd "$candysrc" && GOWORK=off go build -buildvcs=false -o "$tree/plugin-firecracker" ./cmd/serve )
                      printf 'verb:firecracker\ncommand:firecracker\n' > "$tree/plugin-firecracker.providers"

                      # THE DELIVERY, through the changed path. exec.EnsurePluginsInDeployVenue has no
                      # CLI surface yet - nothing in charly calls it, which is exactly why this bed
                      # drives it from the Go package that owns it, over the executor a host:local
                      # venue actually runs through. The replica key is the ACTIVE binary's own
                      # CalVer, the token a deploy passes on the ssh leg of the same contract.
                      hostver="$("${CHARLY_BIN}" version 2>/dev/null | grep -m1 -oE '[0-9]{4}\.[0-9]{3}\.[0-9]{4}')"
                      if [ -z "$hostver" ]; then
                        echo "cannot read the active binary's CalVer version, so the delivery's replica key is unknown" >&2
                        exit 1
                      fi
                      if ! out="$(SPEC_DELIVERY_TREE="$tree" SPEC_DELIVERY_HOSTVER="$hostver" GOWORK=off go test ./exec/ -run TestDeliverTheBuiltTreeIntoTheDeployVenue -count=1 -v 2>&1)"; then
                        printf '%s\n' "$out" >&2
                        echo "the live delivery of the built plugin tree into this venue failed" >&2
                        exit 1
                      fi
                      # A leg that SKIPPED also exits 0, and a bed reporting a delivery it never made
                      # is the defect this whole bed exists to catch - so require the PASS line.
                      case "$out" in
                        *"--- PASS: TestDeliverTheBuiltTreeIntoTheDeployVenue"*) ;;
                        *)
                          printf '%s\n' "$out" >&2
                          echo "the delivery leg did not RUN (skipped or not selected), so nothing was delivered" >&2
                          exit 1
                          ;;
                      esac
                      if [ ! -L /tmp/charly-plugins ]; then
                        echo "the delivery did not publish the stable plugin path the plan emits, so the venue still points at nothing" >&2
                        exit 1
                      fi
                      printf '%s\n' "delivered the built plugin tree; the plan's plugin path now serves $(readlink -f /tmp/charly-plugins)" | tee -a .check/spec-delivery-evidence.log
                  in_container: false
            - check: this venue's own charly SERVES the word only the delivered tree supplies
              id: spec-delivery-venue-serves-the-delivered-word
              context:
                - runtime
              timeout: 900s
              command:
                  command: |
                      set -euo pipefail
                      n=0
                      while [ ! -f exec/charly_plugins.go ]; do
                        cd ..
                        n=$((n + 1))
                        if [ "$n" -gt 8 ] || [ "$PWD" = / ]; then
                          echo "cannot locate the spec module from this venue's cwd" >&2
                          exit 1
                        fi
                      done
                      echo "gating in $(pwd)"

                      # THE ASSERTION, AT THE BOUNDARY A DEPLOY CONSUMES. Not a file that exists, and
                      # not a word a manifest declares: a real charly process, pointed at the plugin
                      # path the plan emits - the sdk's plan compiler emits that same literal as the
                      # plugin variable and the delivery publishes it, sdk#399 - must EXECUTE the
                      # DELIVERED provider and print that provider's own verdict. Nothing else at this
                      # venue can answer the word: the step before this one measured that the venue
                      # serves nothing without a delivered tree, and a dev/worktree charly deliberately
                      # does not load the installed package's plugin directory (issue #328).
                      out="$(CHARLY_PLUGIN_DIR=/tmp/charly-plugins "${CHARLY_BIN}" firecracker doctor 2>&1 || true)"
                      case "$out" in
                        *"firecracker doctor:"*)
                          # The run's own record of what it measured, appended to the file the first
                          # step cleared: `tee` fails the step if it cannot be written, so the PASS
                          # cannot outlive the evidence for it.
                          printf '%s\n' "the venue serves the delivered word: $(printf '%s\n' "$out" | grep -m1 -o 'firecracker doctor: kvm=[a-z]*')" | tee -a .check/spec-delivery-evidence.log
                          ;;
                        *)
                          echo "the venue does NOT serve a word from the delivered tree; the invocation said:" >&2
                          printf '%s\n' "$out" >&2
                          exit 1
                          ;;
                      esac

            - check: the bed releases the shared plugin path and its own claim on it (DISP)
              id: spec-delivery-releases-what-it-claimed
              context:
                - runtime
              timeout: 900s
              command:
                  command: |
                      set -euo pipefail
                      # DISP, applied to RELEASE rather than to take. Step 1 takes the shared path under a marker;
                      # nothing ever released that claim, so after the first run the marker was always present and
                      # step 1's guard passed every time, leaving this bed free to destroy a LATER deploy's tree at
                      # the same path on its next run. This step gives the claim back: it removes the tree THIS bed
                      # published and the marker that claimed it, and touches NOTHING it does not own.
                      owns=/tmp/charly-plugins-spec-delivery-owner
                      if [ ! -f "$owns" ] || [ "$(cat "$owns" 2>/dev/null)" != "check-spec-delivery" ]; then
                        echo "no marker naming this bed, so the shared plugin path is NOT this bed's to clean:" >&2
                        ls -ld /tmp/charly-plugins /tmp/charly-plugins-* 2>/dev/null >&2 || true
                        echo "leaving it untouched (DISP); a tree we did not publish is not ours to remove." >&2
                        printf '%s\n' "released nothing: the shared plugin path was not this bed's claim" | tee -a .check/spec-delivery-evidence.log
                        exit 0
                      fi
                      rm -rf /tmp/charly-plugins
                      rm -rf /tmp/charly-plugins-*
                      rm -f "$owns"
                      rm -rf /tmp/spec-delivery-tree
                      printf '%s\n' "released the published tree and the marker; the shared plugin path is as this bed found it" | tee -a .check/spec-delivery-evidence.log
                  in_container: false
