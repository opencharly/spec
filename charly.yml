version: 2026.261.1747
# The spec module's project manifest. Its maintenance surface is the
# `charly task` verbs below — the same generic plugin-task surface the umbrella
# and charly use. spec owns NO candies/boxes, so there is no `discover:`; only
# the task entities are declared.
#
# Run a task with the `charly` binary (spec is a submodule of
# opencharly/opencharly and opencharly/charly):
#   charly task cue-gen
# The binary is installed as a native package or built once per clone by a
# checkout's `scripts/bootstrap-charly.sh` — spec ships no Go binary of its own.
#
# Two authoring notes every task here obeys:
#   * `run:` shell snippets must use LOWERCASE shell locals: an uppercase ${NAME}
#     is reserved for the plan grammar's check-variable expansion, and an
#     unresolved one makes the step SKIP ("unresolved variables"), not run.
#   * every Go invocation sets GOWORK=off — spec is a standalone module (it is
#     never a workspace member), so a stray ancestor go.work must not shadow it.
repo: github.com/opencharly/spec

# -----------------------------------------------------------------------------
# bootstrap-cue — ensure ./bin/cue is the pinned cue CLI (checksum-verified).
# Idempotent: a present, correct bin/cue short-circuits without a download.
# -----------------------------------------------------------------------------
bootstrap-cue:
  task:
    description: Ensure ./bin/cue is the pinned cue CLI (checksum-verified download)
    dir: .
    plan:
      - run: download and checksum-verify the pinned cue CLI
        command: |
          set -euo pipefail
          mkdir -p bin
          if test -x bin/cue && bin/cue version 2>/dev/null | grep -q 'v0.16.1'; then
            echo "bootstrap-cue: bin/cue is $(bin/cue version | head -1) (already present)"
            exit 0
          fi
          arch="$(uname -m)"
          case "$arch" in
            x86_64) goarch=amd64; sha='5d644c1305a2b86504c8dcd2ec829cf5b4999efc2cf51ee375624e0455f774ae' ;;
            *) echo "bootstrap-cue: unsupported arch $arch (only linux/amd64 is checksum-pinned)" >&2; exit 1 ;;
          esac
          tarball="cue_v0.16.1_linux_${goarch}.tar.gz"
          url="https://github.com/cue-lang/cue/releases/download/v0.16.1/${tarball}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          echo "bootstrap-cue: downloading $url"
          curl -fsSL -o "$tmp/$tarball" "$url"
          echo "${sha}  $tmp/$tarball" | sha256sum -c - || { echo "bootstrap-cue: checksum mismatch — refusing to extract" >&2; exit 1; }
          tar -xzf "$tmp/$tarball" -C "$tmp" cue
          mv "$tmp/cue" bin/cue
          chmod +x bin/cue
          bin/cue version | grep -q 'v0.16.1' || { echo "bootstrap-cue: bin/cue is not v0.16.1" >&2; exit 1; }
          echo "bootstrap-cue: bin/cue is $(bin/cue version | head -1)"
        context: [deploy]

# -----------------------------------------------------------------------------
# bootstrap-protoc — ensure ./bin has the pinned protoc + codegen plugins.
# -----------------------------------------------------------------------------
bootstrap-protoc:
  task:
    description: Ensure ./bin has the pinned protoc + protoc-gen-go + protoc-gen-go-grpc
    dir: .
    plan:
      - run: download and pin protoc + the two Go codegen plugins
        command: |
          set -euo pipefail
          mkdir -p bin
          zip="protoc-28.3-linux-x86_64.zip"
          url="https://github.com/protocolbuffers/protobuf/releases/download/v28.3/$zip"
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          if ! test -x bin/protoc || ! bin/protoc --version 2>/dev/null | grep -q '28.3'; then
            curl -fsSL "$url" -o "$tmp/$zip"
            echo "0ad949f04a6a174da83cdcbdb36dee0a4925272a5b6d83f79a6bf9852076d53f  $tmp/$zip" | sha256sum -c - \
              || { echo "proto:bootstrap: protoc checksum mismatch — refusing tampered/wrong artifact" >&2; exit 1; }
            python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$tmp/$zip" "$tmp/x"
            cp "$tmp/x/bin/protoc" bin/protoc && chmod +x bin/protoc
          fi
          # protoc-gen-go-grpc v1.3.0 is REQUIRED: it emits the
          # SupportPackageIsVersion7 API the pinned grpc library expects. A stale
          # wrong-version binary must be re-installed, not trusted by existence.
          test -x bin/protoc-gen-go || GOWORK=off GOBIN="$PWD/bin" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          if ! test -x bin/protoc-gen-go-grpc || ! bin/protoc-gen-go-grpc --version 2>/dev/null | grep -q '1.3.0'; then
            GOWORK=off GOBIN="$PWD/bin" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
          fi
          echo "bootstrap-protoc: pinned protoc + codegen plugins present"
        context: [deploy]

# -----------------------------------------------------------------------------
# wire-gen — regenerate the protobuf IDL and Go stubs from protocol/schema.
#
#   proto/plugin.pb.go       (messages)
#   proto/plugin_grpc.pb.go  (services)
#
# proto/plugin.proto is generated output, never an authoring surface.
# Reproducible: rm -f bin/protoc*; charly task proto-gen && git diff --exit-code proto
# -----------------------------------------------------------------------------
wire-gen:
  task:
    description: Regenerate proto/plugin.proto and Go stubs from protocol/schema/*.cue
    dir: .
    depends_on: [bootstrap-protoc]
    plan:
      - run: render the proto IDL from CUE and compile the Go stubs
        command: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          GOWORK=off go run ./internal/wiregen -schema=protocol/schema -out=proto/plugin.proto
          bin/protoc \
            --go_out=. --go_opt=module=github.com/opencharly/spec \
            --go-grpc_out=. --go-grpc_opt=module=github.com/opencharly/spec \
            --proto_path=proto proto/plugin.proto
          gofmt -w proto/plugin.pb.go proto/plugin_grpc.pb.go
          echo "wire-gen: regenerated proto/plugin.proto and Go stubs from CUE"
        context: [deploy]

# proto-gen — compatibility alias for wire-gen. The protobuf source is CUE.
proto-gen:
  task:
    description: Alias for wire-gen
    dir: .
    depends_on: [wire-gen]
    plan:
      - run: "no-op alias (wire-gen is the real step)"
        command: "echo 'proto-gen: wire-gen is the canonical task'"
        context: [runtime]

# -----------------------------------------------------------------------------
# cue-gen — regenerate every CUE-owned artifact.
#
#   spec/cue_types_gen.go  (cue exp gengotypes — the Go param structs)
#   spec/vocab_gen.go      (internal/schemagen — the vocab lists)
#   spec/version_gen.go    (internal/schemagen — SchemaVersion/SchemaFloor)
#
# Reproducible: two consecutive runs produce no diff (TestGenReproducible).
# -----------------------------------------------------------------------------
cue-gen:
  task:
    description: Regenerate all CUE-owned artifacts, including the protobuf wire contract
    dir: .
    depends_on: [bootstrap-cue, wire-gen]
    plan:
      - run: gengotypes + schemagen the generated Go
        command: |
          set -euo pipefail
          cue_bin="$PWD/bin/cue"
          gendir="$(mktemp -d)"
          trap 'rm -rf "$gendir"' EXIT
          mkdir -p "$gendir/cue.mod"
          cat > "$gendir/cue.mod/module.cue" <<EOM
          module: "github.com/opencharly/spec/schema/spec-codegen"
          language: version: "v0.16.1"
          EOM
          # 1) Concatenate schema/*.cue the SAME way the runtime sharedCueSchema does,
          #    headed `package spec` + `@go(spec)` (R3: one concatenation, in schemagen).
          GOWORK=off go run ./internal/schemagen -mode=concat -schema=schema -out="$gendir/schema_spec.cue"
          # 2) cue exp gengotypes -> the Go param structs.
          ( cd "$gendir" && "$cue_bin" exp gengotypes ./schema_spec.cue )
          gen="$(ls "$gendir"/cue_types*_gen.go 2>/dev/null | head -1)"
          test -n "$gen" || { echo "cue-gen: gengotypes produced no cue_types*_gen.go" >&2; exit 1; }
          cp "$gen" spec/cue_types_gen.go
          # 2b) Double the generated json struct tags with yaml tags (principled Go
          #     transform inside schemagen -mode=retag — never sed on generated Go).
          GOWORK=off go run ./internal/schemagen -mode=retag -out=spec/cue_types_gen.go
          # 3) Companion generator -> the vocab lists.
          GOWORK=off go run ./internal/schemagen -mode=vocab -schema=schema -out=spec/vocab_gen.go
          # 3b) Companion generator -> the HEAD schema-version consts, read from the
          #     CUE-owned schema/version.cue #SchemaVersion/#SchemaFloor.
          GOWORK=off go run ./internal/schemagen -mode=version -schema=schema -out=spec/version_gen.go
          # 4) gofmt the committed generated files.
          gofmt -w spec/cue_types_gen.go spec/vocab_gen.go spec/version_gen.go
          echo "cue-gen: regenerated spec/{cue_types_gen.go,vocab_gen.go,version_gen.go}"
        context: [deploy]
      - check: regen is reproducible — TestGenReproducible passes on the committed tree
        command: GOWORK=off go test ./spec/ -run TestGenReproducible -count=1
        stdout:
          - contains: ok
        context: [runtime]
